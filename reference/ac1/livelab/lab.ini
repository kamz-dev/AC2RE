; AC1 Lab settings (read by ac1lab.exe and ac1lab.dll at game start)
[Launch]
; 1 = also load ..\tools\ac1_windowed\ac1_windowed.dll first, so the game runs in a normal window
Windowed=1

[Lab]
; 1 = the game keeps running while another window has focus (needed for scripted runs)
KeepRunningInBackground=1
; F1..F12 lab hotkeys while the game window has focus
Hotkeys=1
; overlay shown at start (F1 toggles)
Overlay=1
; local command port for tools\lab.py (127.0.0.1 only); 0 = off
BridgePort=27015
; 1 = OR AbilityMask (hex; default all 34 flags) into every set of the player's ability stack each frame: the test
;     save has not unlocked the air grab (Grasp) and six other abilities yet (RE/05 5.7). Memory only
UnlockAbilities=1
AbilityMask=3FFFFFFFF
; 1 = skip the start-up videos (in memory, EaglePatch's branch at 0x405495)
SkipIntro=1
